<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15171c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Easel">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='10' width='56' height='40' rx='3' fill='%23c9a96e'/%3E%3Crect x='10' y='16' width='44' height='28' fill='%23345'/%3E%3C/svg%3E">
<title>Easel</title>
<style>
:root {
  color-scheme: dark;
  --bg: #15171c; --surface: #1d2027; --surface2: #262a33; --line: #323743;
  --text: #ebe7df; --muted: #9b9ea6; --accent: #c9a96e; --accent-ink: #1b1710;
  --danger: #e5675e; --ok: #6fbf8a;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --radius: 12px;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 var(--sans); }
body { min-height: 100vh; padding-bottom: env(safe-area-inset-bottom); }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; border: 1px solid var(--line); background: var(--surface2); border-radius: 999px; padding: 7px 14px; }
button:hover:not(:disabled) { border-color: #4a5060; }
button:disabled { opacity: .5; cursor: default; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
button.primary:hover:not(:disabled) { filter: brightness(1.08); }
button.ghost { background: transparent; }
button.danger { color: var(--danger); }
button.big { padding: 13px 26px; font-size: 17px; }
select, input[type=text], input[type=password] {
  background: var(--surface2); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; min-width: 0;
}
label.check { display: inline-flex; gap: 8px; align-items: center; color: var(--muted); cursor: pointer; user-select: none; }
[hidden] { display: none !important; }
.muted { color: var(--muted); }
.small { font-size: 13px; }

header.top {
  position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 16px;
  padding: calc(10px + env(safe-area-inset-top)) 20px 10px; background: rgba(21,23,28,.88);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--line);
}
.brand { font-family: var(--serif); font-size: 20px; letter-spacing: .02em; display: flex; align-items: center; gap: 9px; white-space: nowrap; }
.brand svg { width: 26px; height: 20px; }
nav#tabs { display: flex; gap: 6px; overflow-x: auto; flex: 1; scrollbar-width: none; }
nav#tabs::-webkit-scrollbar { display: none; }
.tab { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; background: transparent; border-color: transparent; }
.tab.active { background: var(--surface2); border-color: var(--line); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: #555; flex: none; }
.dot.on { background: var(--ok); box-shadow: 0 0 0 3px rgba(111,191,138,.15); }
.dot.standby { background: #d0a54a; }
.top-actions { display: flex; gap: 8px; }

main { max-width: 1280px; margin: 0 auto; padding: 22px 20px 120px; }

.hero { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 28px; align-items: center; margin-bottom: 30px; }
.frame { position: relative; background: #0b0c0f; border-radius: 6px; padding: 12px; box-shadow: 0 18px 50px rgba(0,0,0,.45), inset 0 0 0 1px #2a2d35; }
.frame .screen { aspect-ratio: 16/9; background: #0f1115; display: grid; place-items: center; overflow: hidden; border-radius: 2px; }
.frame img { width: 100%; height: 100%; object-fit: contain; display: block; }
.frame .caption { position: absolute; left: 20px; bottom: 20px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; background: rgba(0,0,0,.55); padding: 4px 9px; border-radius: 999px; }
.tvname { font-family: var(--serif); font-size: clamp(30px, 4vw, 44px); line-height: 1.1; margin: 0 0 6px; font-weight: 500; }
.meta { color: var(--muted); margin-bottom: 20px; display: flex; gap: 6px 14px; flex-wrap: wrap; }
.send { display: flex; flex-direction: column; gap: 12px; align-items: flex-start; margin-bottom: 22px; }
.send .hint { color: var(--muted); font-size: 13px; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding-top: 18px; border-top: 1px solid var(--line); }
.controls .field { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; }

.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 0 0 14px; flex-wrap: wrap; }
.section-head h2 { font-family: var(--serif); font-weight: 500; font-size: 22px; margin: 0; }
.filters { display: flex; gap: 6px; }
.filters button { padding: 5px 12px; font-size: 13px; background: transparent; }
.filters button.active { background: var(--surface2); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
.tile { position: relative; aspect-ratio: 16/9; border-radius: 8px; overflow: hidden; background: var(--surface); border: 1px solid transparent; padding: 0; }
.tile:hover { border-color: #4a5060; }
.tile img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0; transition: opacity .25s; }
.tile img.loaded { opacity: 1; }
.tile .ph { position: absolute; inset: 0; display: grid; place-items: center; color: #4a4f5c; font-size: 12px; }
.tile.current { outline: 2px solid var(--accent); outline-offset: 2px; }
.badges { position: absolute; top: 6px; left: 6px; display: flex; gap: 4px; }
.badge { font-size: 11px; padding: 2px 7px; border-radius: 999px; background: rgba(0,0,0,.6); color: #ddd; }
.badge.gold { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.empty { text-align: center; padding: 70px 20px; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--radius); }
.empty h3 { font-family: var(--serif); font-weight: 500; color: var(--text); font-size: 24px; margin: 0 0 8px; }

.sleep { text-align: center; padding: 40px 20px; }
.notice { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; color: var(--muted); margin-bottom: 18px; }
.notice.err { border-color: rgba(229,103,94,.5); color: #f0b3ae; }

.drop { position: fixed; inset: 0; z-index: 50; background: rgba(12,13,16,.82); display: grid; place-items: center; pointer-events: none; }
.drop div { border: 2px dashed var(--accent); border-radius: 20px; padding: 60px 70px; font-family: var(--serif); font-size: 28px; text-align: center; }

.queue { position: fixed; right: 18px; bottom: 18px; z-index: 40; width: 340px; max-width: calc(100vw - 36px); background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 16px 40px rgba(0,0,0,.5); overflow: hidden; }
.queue .qhead { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); font-weight: 600; }
.queue .qlist { max-height: 260px; overflow-y: auto; }
.qitem { padding: 9px 14px; border-bottom: 1px solid #262a33; font-size: 13px; }
.qitem:last-child { border-bottom: 0; }
.qitem .row { display: flex; justify-content: space-between; gap: 10px; }
.qitem .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.qitem .st { color: var(--muted); white-space: nowrap; }
.qitem.done .st { color: var(--ok); }
.qitem.failed .st { color: var(--danger); }
.bar { height: 3px; background: #2c3039; border-radius: 2px; margin-top: 6px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
.bar.indet i { width: 35%; animation: indet 1.1s infinite ease-in-out; }
@keyframes indet { from { transform: translateX(-100%); } to { transform: translateX(300%); } }

#toasts { position: fixed; left: 50%; transform: translateX(-50%); bottom: 22px; z-index: 60; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
.toast { background: #2b2f39; border: 1px solid var(--line); padding: 9px 16px; border-radius: 999px; box-shadow: 0 8px 24px rgba(0,0,0,.4); max-width: min(560px, 92vw); font-size: 14px; }
.toast.err { border-color: rgba(229,103,94,.6); }

dialog { overflow: auto; background: var(--surface); color: var(--text); border: 1px solid var(--line); border-radius: 16px; padding: 0; width: min(560px, calc(100vw - 24px)); max-height: calc(100vh - 40px); box-shadow: 0 30px 80px rgba(0,0,0,.6); }
dialog.wide { width: min(980px, calc(100vw - 24px)); }
dialog::backdrop { background: rgba(8,9,12,.7); }
.dlg-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.dlg-head h3 { margin: 0; font-family: var(--serif); font-weight: 500; font-size: 21px; }
.dlg-body { padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.dlg-foot { padding: 12px 18px 16px; display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.x { border: 0; background: transparent; font-size: 22px; line-height: 1; padding: 4px 8px; color: var(--muted); }
.detail { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 20px; }
.detail .pic { background: #0b0c0f; border-radius: 8px; aspect-ratio: 16/9; display: grid; place-items: center; overflow: hidden; }
.detail .pic img { width: 100%; height: 100%; object-fit: contain; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1; }
.form { display: grid; grid-template-columns: 130px 1fr; gap: 10px 12px; align-items: center; }
.form label { color: var(--muted); font-size: 14px; }
.qr { background: #fff; border-radius: 12px; padding: 12px; width: 240px; height: 240px; margin: 0 auto; }
.qr img { width: 100%; height: 100%; display: block; }
.url { font-family: ui-monospace, Consolas, monospace; font-size: 13px; background: var(--surface2); padding: 8px 10px; border-radius: 8px; overflow-wrap: anywhere; }
.found { display: flex; flex-direction: column; gap: 8px; }
.found .item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; background: var(--surface2); border-radius: 10px; }
.spinner { width: 18px; height: 18px; border: 2px solid #444; border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.pairing { display: flex; gap: 14px; align-items: center; padding: 14px; background: var(--surface2); border-radius: 10px; }

/* framing composer */
dialog.composer { width: min(1060px, calc(100vw - 24px)); }
.cmp { display: flex; flex-direction: column; gap: 14px; align-items: center; }
.bezel { background: #0b0c0f; padding: 10px; border-radius: 6px; box-shadow: 0 18px 50px rgba(0,0,0,.45), inset 0 0 0 1px #2a2d35; }
.stage { position: relative; width: min(calc(100vw - 84px), 960px, calc(54vh * var(--pa))); aspect-ratio: var(--pa); overflow: hidden; background: #060708; border-radius: 2px; user-select: none; -webkit-user-select: none; }
.stage.pan { cursor: grab; touch-action: none; }
.stage.pan:active { cursor: grabbing; }
.stage img { position: absolute; max-width: none; pointer-events: none; }
.stage .mat { position: absolute; inset: 0; }
.stage .shade { position: absolute; pointer-events: none; box-shadow: inset 0 3px 12px rgba(0,0,0,.5), inset 0 0 0 1px rgba(0,0,0,.18); }
.stage-msg { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); padding: 20px; text-align: center; }
.cmp-tools { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 640px; }
.seg { display: flex; background: var(--surface2); border: 1px solid var(--line); border-radius: 999px; padding: 3px; gap: 3px; }
.seg button { flex: 1; border: 0; background: transparent; padding: 8px 10px; }
.seg button.on { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.sugg { font-size: 11px; padding: 1px 7px; border-radius: 999px; background: rgba(255,255,255,.12); margin-left: 4px; font-weight: 500; white-space: nowrap; }
.seg button.on .sugg { background: rgba(0,0,0,.14); }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.sw { width: 28px; height: 28px; padding: 0; border-radius: 50%; border: 2px solid rgba(255,255,255,.15); }
.sw.on { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--accent); }
input[type=range] { accent-color: var(--accent); }
.strip { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px; width: 100%; }
.sthumb { position: relative; flex: none; width: 96px; aspect-ratio: 16/10; padding: 0; border-radius: 6px; overflow: hidden; background: var(--surface2); display: grid; place-items: center; }
.sthumb img { width: 100%; height: 100%; object-fit: cover; }
.sthumb.on { outline: 2px solid var(--accent); outline-offset: 1px; }
.sbadge { position: absolute; left: 4px; bottom: 4px; font-size: 10px; padding: 1px 6px; border-radius: 999px; background: rgba(0,0,0,.65); color: #ddd; }
.srm { position: absolute; right: 3px; top: 3px; width: 20px; height: 20px; border-radius: 50%; background: rgba(0,0,0,.65); color: #fff; font-size: 14px; line-height: 20px; text-align: center; }
.notice.row { color: var(--text); }

body.guest .admin-only { display: none !important; }
body:not(.admin) .admin-only { display: none !important; }

@media (max-width: 760px) {
  header.top { padding-left: 14px; padding-right: 14px; gap: 10px; }
  .brand span { display: none; }
  main { padding: 16px 14px 120px; }
  .hero { grid-template-columns: 1fr; gap: 18px; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
  .detail { grid-template-columns: 1fr; }
  .queue { right: 10px; left: 10px; bottom: 10px; width: auto; max-width: none; }
  .form { grid-template-columns: 1fr; gap: 4px; }
  .form label { margin-top: 8px; }
  .send button.big { width: 100%; }
  .send { align-items: stretch; }
  dialog.composer { width: 100vw; max-width: 100vw; height: 100dvh; max-height: 100dvh; margin: 0; border-radius: 0; border: 0; }
  .stage { width: min(calc(100vw - 56px), calc(50vh * var(--pa))); }
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <svg viewBox="0 0 26 20" aria-hidden="true"><rect x="1" y="1" width="24" height="18" rx="1.5" fill="none" stroke="#c9a96e" stroke-width="2"/><rect x="5" y="5" width="16" height="10" fill="#3a4a5c"/></svg>
    <span>Easel</span>
  </div>
  <nav id="tabs"></nav>
  <div class="top-actions">
    <button id="lockBtn" class="ghost" hidden>Unlock</button>
    <button id="addTvBtn" class="ghost admin-only">+ Add TV</button>
    <button id="appBtn" class="ghost admin-only" title="App settings" aria-label="App settings">⚙</button>
  </div>
</header>

<main id="main"><div class="empty"><div class="spinner" style="margin:0 auto"></div></div></main>

<div id="drop" class="drop" hidden><div>Drop to send to<br><b id="dropTarget"></b></div></div>
<div id="queue" class="queue" hidden>
  <div class="qhead"><span id="qtitle">Sending</span><button class="x" id="qclose" aria-label="Close">×</button></div>
  <div class="qlist" id="qlist"></div>
</div>
<div id="toasts"></div>
<input type="file" id="picker" accept="image/*,.heic,.heif" multiple hidden>

<dialog id="dlg"></dialog>

<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const enc = encodeURIComponent;
const store = {
  get(k, d) { try { const v = localStorage.getItem("frames." + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("frames." + k, JSON.stringify(v)); } catch {} },
};

const guestMatch = location.pathname.match(/^\/tv\/(.+)$/);
const S = {
  info: null, tvs: [], tv: null, status: null, statusErr: null, photos: null, photosErr: null,
  filter: "all", mattes: null, pw: store.get("pw", ""),
  guestTv: guestMatch ? decodeURIComponent(guestMatch[1]) : null,
  showNow: store.get("showNow", true),
};
if (S.guestTv) document.body.classList.add("guest");

// ── API ──────────────────────────────────────────────────────────────
async function api(path, opts = {}) {
  const headers = { ...(opts.headers || {}) };
  if (S.pw) headers.Authorization = "Bearer " + S.pw;
  if (opts.json !== undefined) { headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(opts.json); }
  const r = await fetch(path, { method: opts.method || (opts.body ? "POST" : "GET"), headers, body: opts.body });
  if (r.status === 401) { askPassword(); throw new Error("That needs the admin password"); }
  if (!r.ok) {
    let msg = r.statusText;
    try { msg = (await r.json()).error || msg; } catch {}
    throw new Error(msg);
  }
  if (r.status === 202 || r.status === 204) return null;
  return (r.headers.get("content-type") || "").includes("json") ? r.json() : r;
}
const tvPath = (tv, rest = "") => `/api/tvs/${enc(tv)}${rest}`;
const thumbUrl = (tv, id) => tvPath(tv, `/thumb/${enc(id)}`);

// ── toasts ───────────────────────────────────────────────────────────
function toast(msg, err = false, ms = 4000) {
  const t = document.createElement("div");
  t.className = "toast" + (err ? " err" : "");
  t.textContent = msg;
  $("#toasts").append(t);
  setTimeout(() => t.remove(), err ? Math.max(ms, 7000) : ms);
  return t;
}

// ── TVs & tabs ───────────────────────────────────────────────────────
async function loadTvs() {
  S.tvs = await api("/api/tvs");
  if (S.guestTv) {
    const t = S.tvs.find(t => t.name.toLowerCase() === S.guestTv.toLowerCase());
    S.tv = t ? t.name : null;
  } else if (!S.tvs.some(t => t.name === S.tv)) {
    const want = decodeURIComponent(location.hash.slice(1)) || store.get("tv", "");
    S.tv = (S.tvs.find(t => t.name === want) || S.tvs[0] || {}).name || null;
  }
  renderTabs();
}

function renderTabs() {
  const nav = $("#tabs");
  if (S.guestTv) { nav.innerHTML = ""; return; }
  nav.innerHTML = S.tvs.map(t => `<button class="tab ${t.name === S.tv ? "active" : ""}" data-tv="${esc(t.name)}"><span class="dot ${esc(t.power)}"></span>${esc(t.name)}</button>`).join("");
  nav.querySelectorAll(".tab").forEach(b => b.onclick = () => selectTv(b.dataset.tv));
}

function selectTv(name) {
  if (name === S.tv) return;
  S.tv = name; S.status = S.photos = S.statusErr = S.photosErr = null; S.mattes = null; S.filter = "all";
  store.set("tv", name);
  history.replaceState(null, "", "#" + enc(name));
  renderTabs(); render(); loadTv();
}

const curTv = () => S.tvs.find(t => t.name === S.tv);

async function loadTv() {
  const tv = curTv();
  if (!tv) return;
  if (tv.power !== "on") { render(); return; }
  await Promise.all([loadStatus(), loadPhotos()]);
}

async function loadStatus() {
  const name = S.tv;
  try { const s = await api(tvPath(name, "/status")); if (name === S.tv) { S.status = s; S.statusErr = null; } }
  catch (e) { if (name === S.tv) S.statusErr = e.message; }
  if (name === S.tv) renderHero();
}

async function loadPhotos() {
  const name = S.tv;
  try {
    const p = await api(tvPath(name, "/photos" + (S.filter === "favorites" ? "?category=favorites" : "")));
    if (name === S.tv) { S.photos = p; S.photosErr = null; }
  } catch (e) { if (name === S.tv) S.photosErr = e.message; }
  if (name === S.tv) renderGrid();
}

// ── rendering ────────────────────────────────────────────────────────
function render() {
  const main = $("#main");
  document.body.classList.toggle("admin", !!S.info?.admin);
  $("#lockBtn").hidden = !S.info?.password_set || S.info?.admin || !!S.guestTv;
  const nag = S.info?.admin && !S.info.password_set && !S.guestTv && !store.get("pwNagDone", false)
    ? `<div class="notice row"><span class="grow">No admin password yet, so anyone on your network can delete photos or change settings.</span><button id="nagSet">Set a password</button><button class="ghost" id="nagX">Not now</button></div>` : "";
  const wireNag = () => {
    $("#nagSet")?.addEventListener("click", openAppSettings);
    $("#nagX")?.addEventListener("click", () => { store.set("pwNagDone", true); $("#nagX").closest(".notice").remove(); });
  };
  if (!S.tvs.length) {
    main.innerHTML = nag + `<div class="empty"><h3>No TVs yet</h3>
      <p>${S.info?.admin ? "Add your Frame TV to get started. You'll need to press <b>Allow</b> on the TV." : "Nobody has paired a TV with this app yet."}</p>
      <button class="primary big admin-only" id="emptyAdd">Add a TV</button></div>`;
    $("#emptyAdd")?.addEventListener("click", openAddTv);
    wireNag();
    return;
  }
  if (!S.tv) {
    main.innerHTML = `<div class="empty"><h3>Unknown TV</h3><p>There's no TV called “${esc(S.guestTv)}”.</p></div>`;
    return;
  }
  document.title = S.guestTv ? `Send to ${S.tv}` : `${S.tv} · Easel`;
  main.innerHTML = nag + `<section class="hero" id="hero"></section><section id="gallery"></section>`;
  wireNag();
  renderHero(); renderGrid();
}

function renderHero() {
  const el = $("#hero");
  if (!el) return;
  const tv = curTv();
  const s = S.status;

// ── uploading ────────────────────────────────────────────────────────
const Q = { items: [], running: new Set(), hideTimer: null };
let pickTargets = null;

function pick(tvs) {
  pickTargets = tvs;
  const p = $("#picker");
  p.value = "";
  p.click();
}
$("#picker").addEventListener("change", e => { if (e.target.files.length) openComposer([...e.target.files], pickTargets || [S.tv]); });

function isImage(f) {
  return f.type.startsWith("image/") || /\.(jpe?g|png|heic|heif|webp|gif|bmp|tiff?)$/i.test(f.name);
}

/// entries: [{file, framing}] where framing is {fit, crop: {x,y,w,h} | null, matte} or null (TV defaults).
function enqueue(entries, tvs) {
  if (!entries.length) return;
  for (const tv of tvs) {
    entries.forEach((e, i) => Q.items.push({ file: e.file, framing: e.framing, tv, show: S.showNow && i === entries.length - 1, status: "queued", pct: 0, msg: "Waiting" }));
  }
  clearTimeout(Q.hideTimer);
  renderQueue();
  for (const tv of tvs) pump(tv);
}

async function pump(tv) {
  if (Q.running.has(tv)) return;
  Q.running.add(tv);
  let item;
  while ((item = Q.items.find(q => q.tv === tv && q.status === "queued"))) {
    item.status = "sending"; item.msg = "Uploading"; renderQueue();
    try {
      const r = await sendOne(item);
      item.status = "done";
      item.msg = r.duplicate ? "Already on the TV" : r.shown ? "On the TV now" : "Added";
    } catch (e) {
      item.status = "failed"; item.msg = e.message;
    }
    renderQueue();
  }
  Q.running.delete(tv);
  if (!Q.running.size && Q.items.every(q => q.status === "done")) Q.hideTimer = setTimeout(() => { Q.items = []; renderQueue(); }, 5000);
}

async function prepareFile(file) {
  // If the server can't decode HEIC but this browser can (Safari), convert it here.
  const heic = /\.(heic|heif)$/i.test(file.name) || /image\/hei[cf]/.test(file.type);
  if (heic && !S.info?.heif) {
    try {
      const bmp = await createImageBitmap(file);
      const c = document.createElement("canvas");
      c.width = bmp.width; c.height = bmp.height;
      c.getContext("2d").drawImage(bmp, 0, 0);
      const blob = await new Promise(res => c.toBlob(res, "image/jpeg", 0.92));
      if (blob) return { body: blob, name: file.name.replace(/\.(heic|heif)$/i, ".jpg"), type: "image/jpeg" };
    } catch { throw new Error("This server can't read HEIC photos; export as JPEG first"); }
  }
  return { body: file, name: file.name, type: file.type || "application/octet-stream" };
}

async function sendOne(item) {
  const f = await prepareFile(item.file);
  return new Promise((resolve, reject) => {
    const x = new XMLHttpRequest();
    const fr = item.framing;
    let qs = `name=${enc(f.name)}&show=${item.show}`;
    if (fr) qs += `&fit=${fr.fit}&matte=${enc(fr.matte || "")}` + (fr.crop ? `&crop=${[fr.crop.x, fr.crop.y, fr.crop.w, fr.crop.h].join(",")}` : "");
    x.open("POST", tvPath(item.tv, `/upload?${qs}`));
    if (S.pw) x.setRequestHeader("Authorization", "Bearer " + S.pw);
    x.setRequestHeader("Content-Type", f.type);
    x.upload.onprogress = e => {
      if (!e.lengthComputable) return;
      item.pct = Math.round(e.loaded / e.total * 100);
      item.msg = item.pct < 100 ? `Uploading ${item.pct}%` : "Preparing on the TV…";
      renderQueue();
    };
    x.onload = () => {
      let body = {};
      try { body = JSON.parse(x.responseText); } catch {}
      x.status === 200 ? resolve(body) : reject(new Error(body.error || `Failed (${x.status})`));
    };
    x.onerror = () => reject(new Error("Network error"));
    x.send(f.body);
  });
}

function renderQueue() {
  const q = $("#queue");
  if (!Q.items.length) { q.hidden = true; return; }
  q.hidden = false;
  const done = Q.items.filter(i => i.status === "done").length;
  const failed = Q.items.filter(i => i.status === "failed").length;
  const active = Q.items.length - done - failed;
  $("#qtitle").textContent = active ? `Sending ${done + failed + 1} of ${Q.items.length}` : failed ? `${failed} failed, ${done} sent` : `All ${done} sent`;
  const multi = new Set(Q.items.map(i => i.tv)).size > 1;
  $("#qlist").innerHTML = Q.items.map(i => `<div class="qitem ${i.status}">
    <div class="row"><span class="name">${esc(i.file.name)}${multi ? ` <span class="muted">→ ${esc(i.tv)}</span>` : ""}</span><span class="st">${esc(i.msg)}</span></div>
    ${i.status === "sending" ? `<div class="bar ${i.pct >= 100 ? "indet" : ""}"><i style="width:${i.pct}%"></i></div>` : ""}
  </div>`).join("");
}
$("#qclose").onclick = () => { Q.items = Q.items.filter(i => i.status === "queued" || i.status === "sending"); renderQueue(); };

// Drag & drop anywhere.
let dragDepth = 0;
const hasFiles = e => [...(e.dataTransfer?.types || [])].includes("Files");
const composing = () => C && C.kind === "send" && dlg.open;
addEventListener("dragenter", e => {
  if (!hasFiles(e) || !S.tv || curTv()?.power !== "on" || (dlg.open && !composing())) return;
  e.preventDefault(); dragDepth++;
  $("#dropTarget").textContent = S.tv; $("#drop").hidden = false;
});
addEventListener("dragover", e => { if (hasFiles(e)) e.preventDefault(); });
addEventListener("dragleave", () => { if (--dragDepth <= 0) { dragDepth = 0; $("#drop").hidden = true; } });
addEventListener("drop", e => {
  if (!hasFiles(e)) return;
  e.preventDefault(); dragDepth = 0; $("#drop").hidden = true;
  if (S.tv && curTv()?.power === "on" && (!dlg.open || composing())) openComposer([...e.dataTransfer.files], C?.tvs || [S.tv]);
});
// Paste an image (e.g. a screenshot) to send it.
addEventListener("paste", e => {
  const files = [...(e.clipboardData?.files || [])];
  if (files.length && S.tv && curTv()?.power === "on" && !e.target.closest?.("input,textarea") && (!dlg.open || composing())) openComposer(files, C?.tvs || [S.tv]);

const prettyMatte = id => {
  if (!id || id === "none") return "No matte";
  const [t, c] = id.split("_");
  const cap = s => s ? s[0].toUpperCase() + s.slice(1) : "";
  return c ? `${cap(t)}, ${c}` : cap(t);
};
const prettyDate = d => {
  if (!d) return "";
  const m = d.match(/^(\d{4})[:\-](\d\d)[:\-](\d\d)/);
  return m ? new Date(+m[1], +m[2] - 1, +m[3]).toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" }) : d;
};

async function getMattes() {
  if (!S.mattes) S.mattes = await api(tvPath(S.tv, "/mattes")).catch(() => ({ types: [], colors: [] }));
  return S.mattes;
}

function matteSelects(prefix, current, allowAuto = false) {
  const m = S.mattes || { types: [], colors: [] };
  const [t, c] = current && current !== "none" && current !== "auto" ? current.split("_") : [current || (allowAuto ? "auto" : "none"), ""];
  const types = m.types.filter(x => x !== "none");
  return `<select id="${prefix}Type">
      ${allowAuto ? `<option value="auto" ${t === "auto" ? "selected" : ""}>Automatic</option>` : ""}
      <option value="none" ${t === "none" ? "selected" : ""}>No matte</option>
      ${types.map(x => `<option value="${esc(x)}" ${x === t ? "selected" : ""}>${esc(x[0].toUpperCase() + x.slice(1))}</option>`).join("")}
    </select>
    <select id="${prefix}Color" ${["none", "auto"].includes(t) ? "hidden" : ""}>
      ${m.colors.map(x => `<option value="${esc(x)}" ${x === c ? "selected" : ""}>${esc(x)}</option>`).join("")}
    </select>`;
}
function wireMatte(prefix) {
  const t = $(`#${prefix}Type`), c = $(`#${prefix}Color`);
  t.onchange = () => { c.hidden = ["none", "auto"].includes(t.value); };
  return () => ["none", "auto"].includes(t.value) ? t.value : `${t.value}_${c.value}`;
}

// ── framing composer ─────────────────────────────────────────────────
// Approximations of the TV's mattes, for the preview.
const MATTE_COLORS = { polar: "#f4f4f2", antique: "#e9e1cf", warm: "#efe6d8", sand: "#d9c6a5", seafoam: "#a8c8bd", sage: "#a9b39a", burgandy: "#6b2333", navy: "#22304a", apricot: "#f0b48a", byzantine: "#7c3f73", lavender: "#b8a9cf", redorange: "#d4583a", skyblue: "#8fb8d8", turqoise: "#3a9a9a", black: "#151515" };
const MATTE_OPENING = { modernthin: [.86, .86], modern: [.76, .76], modernwide: [.66, .66], flexible: [.8, .8], shadowbox: [.74, .74], panoramic: [.9, .56], triptych: [.84, .7] };
const matteParts = m => { const i = (m || "").indexOf("_"); return i < 0 ? [m || "none", ""] : [m.slice(0, i), m.slice(i + 1)]; };
const cap = x => x ? x[0].toUpperCase() + x.slice(1) : "";
const panelAspect = tv => tv?.resolution?.[0] && tv?.resolution?.[1] ? tv.resolution[0] / tv.resolution[1] : 16 / 9;
const clamp = (v, lo, hi) => Math.min(Math.max(v, lo), hi);
const r4 = v => Math.round(v * 1e4) / 1e4;
let C = null;

// What the TV would do on its own (same rule as the server's "auto"), as the starting point.
function frameDefaults(it, tv) {
  const pa = panelAspect(tv), ia = it.iw / it.ih;
  const pref = ia < 1 ? (tv?.portrait_matte || "shadowbox_polar") : (tv?.matte || "auto");
  const close = Math.abs(ia / pa - 1) <= 0.12;
  it.suggest = close ? "fill" : "whole";
  it.mode = tv?.fit === "cover" ? "fill" : tv?.fit === "contain" || tv?.fit === "original" ? "whole" : it.suggest;
  if (pref === "none" && tv?.fit !== "contain") it.mode = "fill";  // this TV prefers no borders
  it.pref = pref;
  it.matte = pref === "auto" || pref === "none" ? "shadowbox_polar" : pref;
  it.zoom = 1; it.cx = .5; it.cy = .5;
}

function cropOf(it, pa) {
  const ia = it.iw / it.ih;
  const cw = (ia > pa ? pa / ia : 1) / it.zoom, ch = (ia > pa ? 1 : ia / pa) / it.zoom;
  it.cx = clamp(it.cx, cw / 2, 1 - cw / 2); it.cy = clamp(it.cy, ch / 2, 1 - ch / 2);
  return { x: it.cx - cw / 2, y: it.cy - ch / 2, w: cw, h: ch };
}

function setFromCrop(it, crop, pa) {
  const ia = it.iw / it.ih;
  it.zoom = clamp((ia > pa ? pa / ia : 1) / crop.w, 1, 4);
  it.cx = crop.x + crop.w / 2; it.cy = crop.y + crop.h / 2;
}

function framingOf(it, pa) {
  if (!it.iw) return null;
  if (it.mode === "fill") {
    const k = cropOf(it, pa);
    return { fit: "cover", crop: { x: r4(k.x), y: r4(k.y), w: r4(k.w), h: r4(k.h) }, matte: "none" };
  }
  return { fit: "contain", crop: null, matte: it.matte };
}

function openComposer(files, tvs) {
  files = files.filter(isImage);
  if (!files.length) { toast("Those don't look like photos", true); return; }
  const items = files.map(file => ({ file, name: file.name, urls: [] }));
  if (composing()) { C.items.push(...items); items.forEach(loadItem); drawComposer(); return; }
  startComposer({ kind: "send", items, tvs, tv: S.tvs.find(t => t.name === tvs[0]) || curTv() });
}

async function openReframe(p) {
  const tv = curTv();
  let url;
  try { url = URL.createObjectURL(await (await api(tvPath(S.tv, `/photos/${enc(p.id)}/original`))).blob()); }
  catch (e) { toast(e.message, true); return; }
  const pa = panelAspect(tv);
  const it = { name: p.source || "Photo", src: url, urls: [url], init(it) {
    frameDefaults(it, tv);
    const f = p.framing;
    if (f) {
      it.mode = f.fit === "cover" ? "fill" : "whole";
      if (f.crop) setFromCrop(it, f.crop, pa);
      if (f.matte && f.matte !== "none" && f.matte !== "auto") it.matte = f.matte;
    } else if (p.matte) {
      it.mode = p.matte === "none" ? "fill" : "whole";
      if (p.matte !== "none") it.matte = p.matte;
    }
  } };
  startComposer({ kind: "reframe", items: [it], tvs: [S.tv], tv, photo: p });
}

function startComposer(c) {
  C = c; c.sel = 0; c.pa = panelAspect(c.tv);
  const send = c.kind === "send";
  openDialog(send ? (c.tvs.length > 1 ? `Send to ${c.tvs.length} TVs` : `Send to ${esc(c.tvs[0])}`) : "Reframe", `
    <div class="cmp">
      <div class="bezel"><div class="stage" id="cStage" style="--pa:${c.pa}"></div></div>
      <div class="cmp-tools" id="cTools"></div>
      <div class="strip" id="cStrip" hidden></div>
    </div>`,
    send ? `<label class="check"><input type="checkbox" id="cShow" ${S.showNow ? "checked" : ""}> Put it on the TV right away</label><span class="grow"></span>
      <button id="cAll" hidden>Use this framing for all</button><button data-close>Cancel</button><button class="primary" id="cGo">Send</button>`
    : `<span class="grow"></span><button data-close>Cancel</button><button class="primary" id="cGo">Save framing</button>`, true);
  dlg.classList.add("composer");
  dlg.addEventListener("close", () => { if (C === c) { c.items.forEach(it => it.urls.forEach(u => URL.revokeObjectURL(u))); C = null; } }, { once: true });
  wireStage(c);
  $("#cAll")?.addEventListener("click", () => {
    const it = c.items[c.sel];
    c.items.forEach(o => { if (o !== it && o.iw) { o.mode = it.mode; o.matte = it.matte; o.zoom = 1; o.cx = o.cy = .5; } });
    drawStrip(); toast(`All ${c.items.length} photos: ${it.mode === "fill" ? "fill the screen" : prettyMatte(it.matte)}`);
  });
  $("#cGo").onclick = () => send ? composerSend(c) : composerSave(c);
  c.items.forEach(loadItem);
  drawComposer();
  if (!S.mattes) getMattes().then(() => { if (C === c) drawTools(); });
}

async function loadItem(it) {
  const tryUrl = url => new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = url; });
  try {
    let url = it.src || URL.createObjectURL(it.file), im;
    if (!it.src) it.urls.push(url);
    try { im = await tryUrl(url); }
    catch {
      // Not viewable here (e.g. HEIC outside Safari): let the server make a preview.
      const r = await fetch("/api/preview", { method: "POST", body: it.file });
      if (!r.ok) throw new Error();
      url = URL.createObjectURL(await r.blob()); it.urls.push(url);
      im = await tryUrl(url);
    }
    it.url = url; it.iw = im.naturalWidth; it.ih = im.naturalHeight;
    if (it.init) it.init(it); else frameDefaults(it, C?.tv);
  } catch {
    it.error = "No preview for this one. It will be sent with the TV's usual framing.";
  }
  if (C && C.items.includes(it)) drawComposer();
}

function drawComposer() {
  if (!C) return;
  C.sel = clamp(C.sel, 0, C.items.length - 1);
  drawStage(); drawTools(); drawStrip();
  const go = $("#cGo");
  if (go && C.kind === "send") {
    const n = C.items.length;
    go.textContent = `Send ${n > 1 ? n + " photos" : "photo"}`;
  }
}

function drawStage() {
  const c = C, it = c?.items[c.sel], st = $("#cStage");
  if (!st || !it) return;
  if (!it.url) {
    st.className = "stage"; st.dataset.for = "";
    st.innerHTML = `<div class="stage-msg">${it.error ? esc(it.error) : `<div class="spinner"></div>`}</div>`;
    return;
  }
  st.classList.toggle("pan", it.mode === "fill");
  if (st.dataset.for !== it.url) {
    st.innerHTML = `<div class="mat"></div><img alt="" draggable="false"><div class="shade"></div>`;
    st.querySelector("img").src = it.url; st.dataset.for = it.url;
  }
  const img = st.querySelector("img"), mat = st.querySelector(".mat"), shade = st.querySelector(".shade");
  const place = (el, x, y, w, h) => Object.assign(el.style, { left: x * 100 + "%", top: y * 100 + "%", width: w * 100 + "%", height: h * 100 + "%" });
  if (it.mode === "fill") {
    const k = cropOf(it, c.pa);
    mat.style.background = "transparent"; shade.hidden = true; img.style.boxShadow = "none";
    place(img, -k.x / k.w, -k.y / k.h, 1 / k.w, 1 / k.h);
  } else {
    const [type, color] = matteParts(it.matte);
    const [ow, oh] = MATTE_OPENING[type] || MATTE_OPENING.modern;
    const ia = it.iw / it.ih, oa = c.pa * ow / oh;
    const [w, h] = ia > oa ? [ow, ow * c.pa / ia] : [oh * ia / c.pa, oh];
    mat.style.background = MATTE_COLORS[color] || MATTE_COLORS.polar;
    place(img, (1 - w) / 2, (1 - h) / 2, w, h);
    place(shade, (1 - w) / 2, (1 - h) / 2, w, h);
    shade.hidden = type !== "shadowbox";
    img.style.boxShadow = type === "shadowbox" ? "none" : "0 0 0 1px rgba(0,0,0,.12)";
  }
}

function drawTools() {
  const c = C, it = c?.items[c.sel], el = $("#cTools");
  if (!el || !it) return;
  if (!it.url) { el.innerHTML = ""; return; }
  const ia = it.iw / it.ih, lost = Math.round((1 - Math.min(ia / c.pa, c.pa / ia)) * 100);
  const seg = (m, label) => `<button data-mode="${m}" class="${it.mode === m ? "on" : ""}">${label}${it.suggest === m ? `<span class="sugg">Suggested</span>` : ""}</button>`;
  const m = S.mattes || { types: [], colors: [] };
  const types = (m.types.length ? m.types : Object.keys(MATTE_OPENING)).filter(t => t !== "none");
  const colors = m.colors.length ? m.colors : Object.keys(MATTE_COLORS);
  const [mt, mc] = matteParts(it.matte);
  const usual = it.pref && it.pref !== "auto" && it.pref !== "none" ? ` This TV usually uses ${esc(prettyMatte(it.pref).toLowerCase())}.` : "";
  el.innerHTML = `<div class="seg">${seg("fill", "Fill the screen")}${seg("whole", "Show the whole photo")}</div>
    ${it.mode === "fill" ? `
      <div class="row"><span class="muted small">Zoom</span><input type="range" id="cZoom" class="grow" min="1" max="4" step="0.01" value="${it.zoom}"><button class="ghost" id="cReset">Reset</button></div>
      <div class="muted small">${lost > 1 ? `No border. Drag the photo to choose what stays on screen (about ${lost}% is trimmed).` : "No border. This photo already matches the screen's shape."}</div>`
    : `
      <div class="row"><span class="muted small">Border</span><select id="cType">${types.map(t => `<option value="${esc(t)}" ${t === mt ? "selected" : ""}>${esc(cap(t))}</option>`).join("")}</select></div>
      <div class="swatches">${colors.map(col => `<button class="sw ${col === mc ? "on" : ""}" data-color="${esc(col)}" title="${esc(col)}" style="background:${MATTE_COLORS[col] || "#888"}"></button>`).join("")}</div>
      <div class="muted small">Nothing is cropped; the TV adds a border around it.${usual}</div>`}`;
  el.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => { it.mode = b.dataset.mode; drawStage(); drawTools(); drawStrip(); });
  const z = $("#cZoom");
  if (z) z.oninput = () => { it.zoom = +z.value; drawStage(); };
  $("#cReset")?.addEventListener("click", () => { it.zoom = 1; it.cx = it.cy = .5; z.value = 1; drawStage(); });
  $("#cType")?.addEventListener("change", e => { it.matte = `${e.target.value}_${matteParts(it.matte)[1] || "polar"}`; drawStage(); drawStrip(); });
  el.querySelectorAll(".sw").forEach(b => b.onclick = () => {
    it.matte = `${matteParts(it.matte)[0]}_${b.dataset.color}`;
    el.querySelectorAll(".sw").forEach(x => x.classList.toggle("on", x === b)); drawStage();
  });
}

function drawStrip() {
  const c = C, el = $("#cStrip");
  if (!el || !c) return;
  const many = c.items.length > 1;
  el.hidden = !many;
  const all = $("#cAll");
  if (all) all.hidden = !many;
  if (!many) { el.innerHTML = ""; return; }
  el.innerHTML = c.items.map((it, i) => `<button class="sthumb ${i === c.sel ? "on" : ""}" data-i="${i}" title="${esc(it.name)}">
    ${it.url ? `<img src="${it.url}" alt="">` : it.error ? `<span class="muted small">?</span>` : `<span class="spinner"></span>`}
    <span class="sbadge">${it.error ? "Usual" : it.mode === "fill" ? "Fill" : it.mode ? "Border" : "…"}</span>
    <span class="srm" data-rm="${i}" title="Leave this one out">×</span></button>`).join("");
  el.querySelectorAll(".sthumb").forEach(b => b.onclick = e => {
    const i = +b.dataset.i;
    if (e.target.dataset.rm !== undefined) {
      c.items[i].urls.forEach(u => URL.revokeObjectURL(u));
      c.items.splice(i, 1);
      if (c.sel >= i && c.sel > 0) c.sel--;
    } else c.sel = i;
    drawComposer();
  });
}

function wireStage(c) {
  const st = $("#cStage"), ptrs = new Map();
  const cur = () => c.items[c.sel];
  const syncZoom = () => { const z = $("#cZoom"); if (z) z.value = cur().zoom; };
  st.addEventListener("pointerdown", e => {
    if (cur()?.mode !== "fill" || !cur().url) return;
    st.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  });
  st.addEventListener("pointermove", e => {
    const prev = ptrs.get(e.pointerId);
    if (!prev) return;
    const it = cur(), now = { x: e.clientX, y: e.clientY }, r = st.getBoundingClientRect();
    if (ptrs.size === 1) {
      const k = cropOf(it, c.pa);
      it.cx -= (now.x - prev.x) * k.w / r.width; it.cy -= (now.y - prev.y) * k.h / r.height;
    } else if (ptrs.size === 2) {
      const other = [...ptrs].find(([id]) => id !== e.pointerId)[1];
      const d0 = Math.hypot(prev.x - other.x, prev.y - other.y), d1 = Math.hypot(now.x - other.x, now.y - other.y);
      if (d0 > 0) { it.zoom = clamp(it.zoom * d1 / d0, 1, 4); syncZoom(); }
    }
    ptrs.set(e.pointerId, now); drawStage();
  });
  const up = e => ptrs.delete(e.pointerId);
  st.addEventListener("pointerup", up); st.addEventListener("pointercancel", up);
  st.addEventListener("wheel", e => {
    const it = cur();
    if (it?.mode !== "fill" || !it.url) return;
    e.preventDefault();
    it.zoom = clamp(it.zoom * Math.exp(-e.deltaY * 0.0015), 1, 4); syncZoom(); drawStage();
  }, { passive: false });
}

function composerSend(c) {
  const entries = c.items.map(it => ({ file: it.file, framing: framingOf(it, c.pa) }));
  const show = $("#cShow");
  if (show) { S.showNow = show.checked; store.set("showNow", S.showNow); }
  dlg.close();
  enqueue(entries, c.tvs);
}

function composerSave(c) {
  const f = framingOf(c.items[0], c.pa);
  if (!f) return;
  const go = $("#cGo");
  go.disabled = true; go.textContent = "Saving to the TV…";
  act(async () => {
    await api(tvPath(S.tv, `/photos/${enc(c.photo.id)}/reframe`), { json: f });
    dlg.close(); toast("Reframed"); loadPhotos(); setTimeout(loadStatus, 800);
  }).finally(() => { if (go.isConnected) { go.disabled = false; go.textContent = "Save framing"; } });
}

function askPassword() {
  if (dlg.open && $("#pw")) return;
  openDialog("Admin password", `<p class="muted" style="margin:0">Managing the TVs needs the password set on the server. Anyone can still send photos without it.</p>
    <input type="password" id="pw" placeholder="Password" autocomplete="current-password">`,
    `<button data-close>Cancel</button><button class="primary" id="pwOk">Unlock</button>`);
  const ok = async () => {
    S.pw = $("#pw").value;
    const info = await api("/api/info").catch(() => null);
    if (info?.admin) { store.set("pw", S.pw); S.info = info; dlg.close(); render(); loadTv(); toast("Unlocked"); }
    else { S.pw = ""; toast("Wrong password", true); }
  };
  $("#pwOk").onclick = ok;
  $("#pw").onkeydown = e => { if (e.key === "Enter") ok(); };
  setTimeout(() => $("#pw")?.focus(), 50);
}
$("#lockBtn").onclick = askPassword;

// ── live updates ─────────────────────────────────────────────────────
const debounced = {};
function soon(key, fn, ms = 600) { clearTimeout(debounced[key]); debounced[key] = setTimeout(fn, ms); }
let syncToast = null;

function connectEvents() {
  const es = new EventSource("/api/events");
  es.onmessage = m => {
    let e; try { e = JSON.parse(m.data); } catch { return; }
    const here = e.tv === S.tv;
    switch (e.type) {
      case "thumbs": if (here) thumbsArrived(e.ids); break;
      case "uploaded": case "changed": case "sync-done":
        if (here) { soon("photos", loadPhotos); soon("status", loadStatus, 900); }
        if (e.type === "sync-done") { syncToast?.remove(); toast(`${e.tv}: sync finished, ${e.uploaded} added${e.deleted ? `, ${e.deleted} removed` : ""}${e.failed ? `, ${e.failed} failed` : ""}`); }
        break;
      case "tv-event": if (here) soon("status", loadStatus, 900); break;
      case "tvs-changed": soon("tvs", async () => { await loadTvs(); renderHero(); }); break;
      case "settings-changed": soon("info", async () => { S.info = await api("/api/info").catch(() => S.info); }); break;
      case "sync-start": syncToast?.remove(); syncToast = toast(`${e.tv}: syncing ${e.upload} new photos…`, false, 600000); break;
      case "sync-progress": if (syncToast) syncToast.textContent = `${e.tv}: uploading ${e.index} of ${e.total}…`; break;
      case "error": if (!Q.items.some(i => i.status === "sending" && i.tv === e.tv)) toast(e.message, true); break;
    }
  };
  es.onerror = () => { es.close(); setTimeout(connectEvents, 3000); };
}

// ── start ────────────────────────────────────────────────────────────
(async function start() {
  try {
    S.info = await api("/api/info");
    if (S.pw && !S.info.admin && S.info.password_set) { S.pw = ""; store.set("pw", ""); }
    await loadTvs();
  } catch (e) {
    $("#main").innerHTML = `<div class="notice err">Couldn't reach the server: ${esc(e.message)}</div>`;
    return;
  }
  render();
  loadTv();
  connectEvents();
  // Keep power states fresh (TVs go to sleep with their motion sensors).
  setInterval(async () => {
    const before = curTv()?.power;
    await loadTvs().catch(() => {});
    if (curTv()?.power !== before) { render(); loadTv(); }
  }, 60000);
})();
</script>
