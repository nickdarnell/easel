name: Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev libheif-dev
      # rustup picks up rust-toolchain.toml: the stable channel with rustfmt and clippy.
      - run: rustup show active-toolchain
      # Caches the cargo registry and compiled dependencies (keyed on Cargo.lock + rustc version).
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      # cargo test regenerates web/src/api from the Rust API types (ts-rs); they must be committed.
      - name: Check the TypeScript bindings are up to date
        run: |
          git add --intent-to-add web/src/api
          git diff --exit-code -- web/src/api || {
            echo "::error::web/src/api is stale: run cargo test and commit the result"
            exit 1
          }

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run format:check
      # Type-checks with vue-tsc, then builds with Vite.
      - run: npm run build

  image:
    needs: [test, web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The release version comes from Cargo.toml: bump it there and every build of main is tagged
      # with it (0.1.2, 0.1 and 0), so you can pin a version and updaters notice new ones.
      - id: version
        run: |
          v=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          echo "full=$v" >> "$GITHUB_OUTPUT"
          echo "minor=${v%.*}" >> "$GITHUB_OUTPUT"
          echo "major=${v%%.*}" >> "$GITHUB_OUTPUT"
          # A release tag must match: v0.2.0 is only for a build whose Cargo.toml says 0.2.0.
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF#refs/tags/v}" != "$v" ]]; then
            echo "::error::tag ${GITHUB_REF#refs/tags/} doesn't match Cargo.toml's version $v"
            exit 1
          fi
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.version.outputs.full }},enable={{is_default_branch}}
            type=raw,value=${{ steps.version.outputs.minor }},enable={{is_default_branch}}
            type=raw,value=${{ steps.version.outputs.major }},enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=ref,event=pr
          # Standard OCI labels (source, revision, created) are added automatically; these fill in
          # the rest, plus what Unraid and Watchtower look for.
          labels: |
            org.opencontainers.image.title=Easel
            org.opencontainers.image.description=Photo manager for Samsung The Frame TVs: send photos from any phone on your Wi-Fi, frame them, and manage what's on each TV.
            org.opencontainers.image.version=${{ steps.version.outputs.full }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}#readme
            net.unraid.docker.webui=http://[IP]:[PORT:3273]/
            net.unraid.docker.icon=https://raw.githubusercontent.com/${{ github.repository }}/main/assets/icon.png
            com.centurylinklabs.watchtower.enable=true
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: EASEL_COMMIT=${{ github.sha }}
          # Layer cache, including the compiled-dependencies layer (see Dockerfile).
          cache-from: type=gha
          cache-to: type=gha,mode=max
